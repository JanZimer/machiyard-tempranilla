<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MachiYard Tempranilla</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-app: #060d14;
      --bg-card: #0d1722;
      --bg-card-soft: #122030;
      --bg-input: #09121b;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.26);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #10b981;
      --green-bright: #22c55e;
      --green-dark: #065f46;
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.14);
      --blue: #38bdf8;
      --danger: #ef4444;
      --nav-height: 70px;
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 calc(var(--nav-height) + 28px) 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #0d1e2f 0%, var(--bg-app) 55%);
      color: var(--text);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 0;
    }

    /* Header superior */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
